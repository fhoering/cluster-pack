name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  standalone_spark_with_S3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    
    - name: Build spark-docker
      run: docker build -t spark-docker ./examples/spark-with-S3
    
    - name: Build the docker-compose stack
      run: docker-compose -f ./examples/spark-with-S3/docker-compose.yml up -d
      
    - name: Check running containers
      run: docker ps -a

    - name: Run spark Job
      run: docker exec spark-master ./examples/spark-with-S3/scripts/run_spark_example.sh


  conda_tests:
    steps:
      - uses: actions/checkout@v2

      - name: setup-conda
        uses: s-weigand/setup-conda@v1.0.3

      - name: create env
        run: |
          conda create -y --name test_env python=3.6 
          source activate test_env
          pip install .
          pip install -r tests-requirements.txt

      - name: conda tests
        run: pytest -m conda -s tests --log-cli-level=DEBUG
    